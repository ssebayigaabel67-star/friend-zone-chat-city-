<!DOCTYPE html>
<html>
<head>
    <title>Sign In - FriendsZoneChat City</title>

    <style>
        body{
            background-image:url("Add.jpg");
            background-size:cover;
            background-repeat:no-repeat;
            background-position:center;
            height:100vh;
            text-align:center;
        }

        h1{
            color:red;
        }

        h3{
            color:greenyellow;
        }

        input{
            width:250px;
            padding:10px;
            margin:8px;
        }

        button{
            width:270px;
            padding:10px;
            color:red;
            font-weight:bold;
            cursor:pointer;
        }

        a{
            color:yellow;
            text-decoration:none;
            font-weight:bold;
        }

        #message{
            color:red;
            font-weight:bold;
        }
    </style>
</head>

<body>

<h1>FriendsZoneChat City</h1>

<h3>Sign In</h3>

<input type="email" id="email" placeholder="Enter your email" required><br>

<input type="password" id="password" placeholder="Enter your password" required><br>

<button id="loginBtn">Sign In</button>

<p id="message"></p>

<br>

<a href="forgotpassword.html">Forgot Password?</a>

<h3>Don't have an account ?</h3>

<a href="Create account.html">
    <button type="button">Create Account</button>
</a>

<script type="module" src="Sign in.js"></script>

</body>
</html>
